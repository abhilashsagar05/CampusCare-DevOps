services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campuscare
      POSTGRES_USER: campuscare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuscare-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscare -d campuscare"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://campuscare:${POSTGRES_PASSWORD:-campuscare-local-only}@db:5432/campuscare
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-sharing}
      CAMPUSCARE_ADMIN_PASSWORD: ${CAMPUSCARE_ADMIN_PASSWORD:-AdminDemo123!}
      CAMPUSCARE_TECH_PASSWORD: ${CAMPUSCARE_TECH_PASSWORD:-TechDemo123!}
      CAMPUSCARE_TECH2_PASSWORD: ${CAMPUSCARE_TECH2_PASSWORD:-TechDemo456!}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-campuscare-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
