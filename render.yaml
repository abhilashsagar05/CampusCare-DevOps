databases:
  - name: campuscare-db
    databaseName: campuscare
    user: campuscare
    plan: free

services:
  - type: web
    name: campuscare
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campuscare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CAMPUSCARE_ADMIN_PASSWORD
        sync: false
      - key: CAMPUSCARE_TECH_PASSWORD
        sync: false
      - key: CAMPUSCARE_TECH2_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3

